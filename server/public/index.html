<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QMT Bridge</title>
    <link rel="icon" type="image/svg+xml" href="./favicon-local.svg" />
    <link rel="stylesheet" href="./style.css?v=0.8.8" />
    <script src="./site-env.js?v=0.8.8"></script>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>QMT Bridge <span id="env-badge" class="env-badge">—</span> <span id="app-version" class="app-version">v--</span></h1>
        <p id="latest-sync">Latest Syn: --</p>
        <button type="button" id="logout-btn" class="logout-btn" hidden>退出</button>
      </div>
      <p id="meta">等待 QMT 推送…</p>
      <div class="toolbar">
        <label class="qty-control">
          <span>默认数量</span>
          <strong id="hang-qty-value">10000</strong>
          <input id="hang-qty" type="range" min="5000" max="15000" step="1000" value="10000" />
        </label>
      </div>
    </header>
    <main>
      <section class="ladder-section">
        <div class="ladder-head">
          <span>价格</span>
          <span>挂单</span>
          <span>成交</span>
          <span>撤单</span>
        </div>
        <div id="ladder" class="ladder"></div>
      </section>
    </main>
    <script src="./app.js?v=0.8.8"></script>
  </body>
</html>
